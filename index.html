    <script>
      // Apply saved theme before first paint to avoid flash
      (function () {
        try {
          var saved = localStorage.getItem("dr-theme");
          var theme = saved || "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
